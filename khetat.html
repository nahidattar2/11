<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة تنفيذ الخطط العلاجية والإثرائية</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Geeza Pro","GeezaPro","Noto Naskh Arabic",Tahoma,sans-serif;color:#2e1660;min-height:100vh;line-height:1.6;background:linear-gradient(180deg,#e6d8fb 0%,#f0e8fd 35%,#f9f5ff 100%)}
.page{max-width:1180px;margin:0 auto;padding:18px 16px 30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top a,.top button{font:inherit;font-weight:bold;text-decoration:none;border:0;cursor:pointer;border-radius:12px;padding:8px 16px;background:#fff;color:#4a2a9c;box-shadow:0 3px 10px rgba(110,70,190,.18)}
h1{text-align:center;font-size:40px;font-weight:900;color:#3a1c74;margin:10px 0 0}
.sub{text-align:center;font-size:22px;font-weight:bold;color:#6a4bb0;margin-bottom:14px}
.tabs{display:flex;justify-content:center;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
.tab{font:inherit;font-size:24px;font-weight:bold;border:2px solid #b596f2;background:#fff;color:#4a2a9c;border-radius:16px;padding:8px 34px;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#9b74e6,#6440b4);color:#fff;border-color:#6440b4}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rc{background:rgba(255,255,255,.85);border:1.5px solid #fff;border-radius:24px;padding:16px 20px;display:flex;align-items:center;gap:20px;box-shadow:0 8px 24px rgba(110,70,190,.16)}
.rc h2{font-size:27px;font-weight:900}.rc p{font-size:19px;color:#5b4a8a;font-weight:bold}
.ring{position:relative;width:150px;height:150px;flex:none}.ring svg{width:100%;height:100%}.ring circle{transition:stroke-dasharray 1s}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}.rt b{font-size:36px}.rt small{font-size:15px;color:#6a5a99;font-weight:bold}
.bar{height:14px;background:#ece5f6;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:9px;transition:width 1s}
.rem .bar i{background:linear-gradient(90deg,#f0a7c9,#c2185b)}.enr .bar i{background:linear-gradient(90deg,#b596f2,#4a2a9c)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.lst{background:rgba(255,255,255,.85);border-radius:24px;padding:14px 18px;box-shadow:0 8px 24px rgba(110,70,190,.12)}
.lst h3{font-size:23px;margin-bottom:8px}
.st{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;margin-top:8px;font-size:21px;font-weight:bold;background:#faf7ff;border:1.5px solid #ece3f8}
.st .nm{flex:1}.st .tg{font-size:16px;border-radius:999px;padding:3px 12px;white-space:nowrap}
.done{background:#eaf8ef;border-color:#bfe6cc}.done .tg{background:#1f8a4c;color:#fff}
.prog{background:#fff7e8;border-color:#f3d9a4}.prog .tg{background:#c98a12;color:#fff}
.none .tg{background:#ece3f8;color:#6a5a99}
.sk{display:block;font-size:14px;font-weight:normal;color:#6a5a99}
.empty{color:#6a5a99;text-align:center;padding:18px;font-size:18px}
.note{text-align:center;color:#6a5a99;font-size:15px;margin-top:16px}
/* القفل */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e6d8fb,#f9f5ff);z-index:9}
.lk{background:#fff;border-radius:26px;padding:28px 30px;text-align:center;box-shadow:0 12px 34px rgba(110,70,190,.25);width:min(420px,92vw)}
.lk h2{font-size:26px;margin:8px 0 14px}.lk input{font:inherit;font-size:30px;text-align:center;letter-spacing:.4em;width:100%;border:2px solid #cdb6f6;border-radius:14px;padding:8px;outline:0;direction:ltr}
.lk button{font:inherit;font-size:22px;font-weight:bold;margin-top:14px;width:100%;border:0;border-radius:14px;padding:10px;color:#fff;background:linear-gradient(180deg,#9b74e6,#6440b4);cursor:pointer}
.lk .er{color:#c2185b;font-weight:bold;min-height:1.6em;margin-top:6px}
@media(max-width:820px){.rings,.lists{grid-template-columns:1fr}h1{font-size:30px}.ring{width:120px;height:120px}.rt b{font-size:28px}.tab{font-size:19px;padding:6px 18px}.st{font-size:18px}}
</style></head><body>
<div id="lock"><div class="lk"><div style="font-size:44px">🔒</div><h2>للمعلمة فقط — أدخلي الرقم السري</h2>
<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button onclick="unlock()">دخول</button><div class="er" id="er"></div></div></div>

<div class="page">
<div class="top"><a href="tadreeb.html">→ مساحة الرياضيات</a><button onclick="load(true)">🔄 تحديث</button></div>
<h1 id="ttl">متابعة تنفيذ الخطط</h1><div class="sub" id="sub"></div>
<div class="tabs" id="tabs"></div>
<div id="app"><div class="empty">جارٍ تحميل النتائج…</div></div>
<div class="note" id="note"></div>
</div>

<script>
/* ===== الإعدادات ===== */
const PIN="1448";                                   // الرقم السري — غيّريه من هنا
const GRADES_API="https://script.google.com/macros/s/AKfycby_HYmh-nMk9-EO3Q86QHOciMCGOry3h62pj-Zrhzy-qTym2UEthhksXF8u_-Si5X58KA/exec";
const PLANS_API="https://script.google.com/macros/s/AKfycbzsP_TgAj852n0P5ocWo8rg08w5xNAkRzfRI90wo2dyhJKs-eWFqNWIQh3fhhBMtgZqwQ/exec"; // السكربت الشامل
const PLANS_SS="1CwKsXEYO8UiZ6qSyYCxvBbxVitAUyeiHiEP4vylvJKw";  // جدول «متابعة الخطط العلاجية والإثرائية»
const REM_BELOW=50, ENR_FROM=75;                     // المطلوب منها خطة علاجية: أقل من ٥٠٪ — إثرائية: ٧٥٪ فأكثر
const CH={
  1:{t:"الفصل الأول: التبرير والبرهان",book:"التبرير والبرهان",quiz:null},
  2:{t:"الفصل الثاني: التوازي والتعامد",book:"التوازي والتعامد",quiz:"اختبار الفصل 2 - التوازي والتعامد",total:20}
};
/* ===================== */
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"").replace(/\s+/g," ").trim().toLowerCase();
const clsNum=c=>{const m=String(c).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).match(/\d/);return m?m[0]:""};
const chId=+(new URLSearchParams(location.search).get("ch")||2), C=CH[chId]||CH[2];
let CLS="1",DATA=null;

function unlock(){if(document.getElementById("pin").value===PIN){try{sessionStorage.setItem("kpin","1")}catch(e){}document.getElementById("lock").remove();load()}else{document.getElementById("er").textContent="الرقم السري غير صحيح"}}
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
try{if(sessionStorage.getItem("kpin")==="1"){document.getElementById("lock").remove();setTimeout(load)}}catch(e){}

function jsonp(url){return new Promise((ok,no)=>{const cb="cb"+Math.random().toString(36).slice(2);const s=document.createElement("script");
  const to=setTimeout(()=>{delete window[cb];s.remove();no("timeout")},15000);
  window[cb]=d=>{clearTimeout(to);delete window[cb];s.remove();ok(d)};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&_="+Date.now();s.onerror=()=>{clearTimeout(to);no("err")};document.body.appendChild(s)})}

const same=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b)return true;const A=a.split(" "),B=b.split(" ");
  return A[0]===B[0]&&(A.length<2||B.length<2||A[1]===B[1])};

async function load(fresh){
  document.getElementById("ttl").textContent="متابعة تنفيذ الخطط — "+C.t;
  document.getElementById("sub").textContent="من نفّذت الخطة العلاجية ومن نفّذت الخطة الإثرائية";
  try{
    const [g,p]=await Promise.all([C.quiz?jsonp(GRADES_API+"?quiz="+encodeURIComponent(C.quiz)):Promise.resolve({rows:[]}),
      jsonp(PLANS_API+"?tab="+encodeURIComponent("كل النتائج")+"&ss="+PLANS_SS)]);
    DATA={grades:(g.rows||[]),plans:(p.rows||[]).filter(r=>norm(r["فصل الكتاب"])===norm(C.book))};
    build();
  }catch(e){document.getElementById("app").innerHTML='<div class="empty">تعذّر تحميل النتائج الآن — تأكدي من الاتصال واضغطي «تحديث».</div>'}
}

function build(){
  // قائمة الطالبات من اختبار الفصل (المحاولة الأولى لكل طالبة)
  const roster=[];
  DATA.grades.forEach(r=>{const nm=String(r.name||"").trim();if(nm.length<3||norm(nm)==="ناهد"||(!/[؀-ۿ]/.test(nm)&&nm.length>22))return;
    const c=clsNum(r.cls);if(roster.some(x=>x.c===c&&same(x.n,nm)))return;
    roster.push({n:nm,c,p:Math.round(100*(+r.score)/(+r.total||C.total||1))})});
  // سجل الخطط
  DATA.plans.forEach(r=>{const nm=String(r["اسم الطالبة"]||"").trim(),c=clsNum(r["الفصل"]);if(!nm)return;
    let s=roster.find(x=>x.c===c&&same(x.n,nm));if(!s){s={n:nm,c,p:null};roster.push(s)}
    const type=String(r["الخطة"]).includes("إثرا")||String(r["الخطة"]).includes("اثرا")?"e":"r";
    (s[type]=s[type]||[]).push({sk:r["المهارة"],ok:String(r["النتيجة"]).includes("أتقن")&&!String(r["النتيجة"]).includes("لم")})});
  const classes=["1","2","3"];
  document.getElementById("tabs").innerHTML=classes.map(c=>`<button class="tab ${c===CLS?"on":""}" onclick="CLS='${c}';build()">أولى ${AR(c)}</button>`).join("");
  const L=roster.filter(s=>s.c===CLS);
  const remT=L.filter(s=>(s.p!==null&&s.p<REM_BELOW)||s.r), enrT=L.filter(s=>(s.p!==null&&s.p>=ENR_FROM)||s.e);
  const st=s=>{if(!s.r)return"none";const sk={};s.r.forEach(x=>{sk[x.sk]=sk[x.sk]||x.ok});return Object.values(sk).every(Boolean)?"done":"prog"};
  const remDone=remT.filter(s=>st(s)==="done").length, enrDone=enrT.filter(s=>s.e).length;
  const ring=(p,col1,col2,sub)=>{const r=42,c=2*Math.PI*r,id="g"+col1.slice(1);return`<div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="${id}"><stop offset="0" stop-color="${col1}"/><stop offset="1" stop-color="${col2}"/></linearGradient></defs><circle cx="50" cy="50" r="${r}" fill="none" stroke="#ece5f6" stroke-width="11"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#${id})" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 50 50)"/></svg><div class="rt"><b>${AR(p)}٪</b><small>${sub}</small></div></div>`};
  const pr=Math.round(remT.length?100*remDone/remT.length:0), pe=Math.round(enrT.length?100*enrDone/enrT.length:0);
  let h=`<div class="rings">
   <div class="rc rem">${ring(pr,"#f0a7c9","#c2185b",`${AR(remDone)} من ${AR(remT.length)}`)}<div style="flex:1"><h2>🩺 الخطة العلاجية</h2><p>${remT.length?`نفّذتها وأتقنت ${AR(remDone)} من ${AR(remT.length)} طالبة`:"لا توجد طالبات مطلوب منهن خطة علاجية"}</p><div class="bar"><i style="width:${pr}%"></i></div></div></div>
   <div class="rc enr">${ring(pe,"#b596f2","#4a2a9c",`${AR(enrDone)} من ${AR(enrT.length)}`)}<div style="flex:1"><h2>🚀 الخطة الإثرائية</h2><p>${enrT.length?`نفّذتها ${AR(enrDone)} من ${AR(enrT.length)} طالبة`:"لا توجد طالبات في الخطة الإثرائية"}</p><div class="bar"><i style="width:${pe}%"></i></div></div></div></div>`;
  const tagR={done:"نفّذت الخطة ✓",prog:"قيد المعالجة",none:"لم تبدأ بعد"};
  const order={prog:0,none:1,done:2};
  h+=`<div class="lists"><div class="lst"><h3>🩺 طالبات الخطة العلاجية</h3>${remT.length?remT.sort((a,b)=>order[st(a)]-order[st(b)]).map(s=>{const k=st(s);
      const sk=s.r?[...new Set(s.r.map(x=>x.sk))].map(x=>{const ok=s.r.some(y=>y.sk===x&&y.ok);return(ok?"✓ ":"… ")+x}).join(" · "):"";
      return`<div class="st ${k}"><span class="nm">${esc(s.n)}${sk?`<span class="sk">${esc(sk)}</span>`:""}</span><span class="tg">${tagR[k]}</span></div>`}).join(""):'<div class="empty">—</div>'}</div>
   <div class="lst"><h3>🚀 طالبات الخطة الإثرائية</h3>${enrT.length?enrT.sort((a,b)=>(b.e?1:0)-(a.e?1:0)).map(s=>`<div class="st ${s.e?"done":"none"}"><span class="nm">${esc(s.n)}</span><span class="tg">${s.e?"نفّذت الخطة ✓":"لم تبدأ بعد"}</span></div>`).join(""):'<div class="empty">—</div>'}</div></div>`;
  document.getElementById("app").innerHTML=h;
  document.getElementById("note").textContent=(C.quiz?`المطلوب منها خطة علاجية: أقل من ${AR(REM_BELOW)}٪ في اختبار الفصل، والإثرائية: ${AR(ENR_FROM)}٪ فأكثر — وتُضاف كل طالبة بدأت خطة من تلقاء نفسها.`:"لا يوجد اختبار لهذا الفصل في جدول الدرجات؛ تظهر الطالبات اللاتي بدأن الخطط.")+" تتحدث النتائج تلقائيًا من جدول المتابعة.";
}
</script></body></html>
