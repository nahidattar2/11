<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>روابط اختباراتي</title>
<style>
:root{--bg:#f6f2fb;--card:#fff;--tx:#241b3a;--mut:#6b6185;--pri:#5b2fb0;--pri2:#efe8fb;--bd:#ddd3ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 16px}
h1{color:var(--pri);margin:0;font-size:1.9rem}.tch{color:var(--pri);font-weight:800;font-size:1.25rem;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
h2{margin:0;font-size:1.3rem}.sub{color:var(--mut);margin:2px 0 12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.b{flex:1;min-width:200px;text-align:center;text-decoration:none;font-weight:800;font-size:1.1rem;padding:16px;border-radius:14px;background:var(--pri2);color:var(--pri);border:2px solid var(--pri)}
.b.pri{background:var(--pri);color:#fff}
.qb{margin-top:10px;width:100%;font:inherit;font-weight:700;padding:10px;border-radius:12px;border:2px dashed var(--bd);background:transparent;color:var(--tx);cursor:pointer;display:none}
.url{color:var(--mut);font-size:.8rem;margin-top:8px;text-align:center;word-break:break-all}
#ov{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;padding:20px}
#ovq img,#ovq canvas{width:min(65vh,85vw)!important;height:auto!important}#ov h3{margin:0;color:var(--pri);font-size:2rem;text-align:center}
#ov button{font:inherit;font-weight:800;font-size:1.1rem;padding:12px 30px;border-radius:12px;border:0;background:var(--pri);color:#fff}
</style></head><body><div class="w">
<h1>روابط اختباراتي 🔗</h1><p class="tch">إعداد المعلمة: ناهد عطار</p>
<section class="card">
  <h2>اختبار تصنيف المثلثات (٢)</h2><p class="sub">الدرس 3-1 · ٧ أسئلة</p>
  <div class="btns">
    <a class="b pri" href="https://nahidattar2.github.io/11/" target="_blank">📝 رابط الطالبات</a>
    <a class="b" href="https://nahidattar2.github.io/11/board.html" target="_blank">🏆 البورد (للسبورة)</a>
  </div>
  <button class="qb" data-u="https://nahidattar2.github.io/11/" data-t="اختبار تصنيف المثلثات (٢)">عرض رمز QR للطالبات</button>
  <div class="url" dir="ltr">https://nahidattar2.github.io/11/</div>
</section>
<section class="card">
  <h2>اختبار المثلثات المتطابقة</h2><p class="sub">الدرس 3-3 · ٧ أسئلة</p>
  <div class="btns">
    <a class="b pri" href="https://nahidattar2.github.io/11/3-3.html" target="_blank">📝 رابط الطالبات</a>
    <a class="b" href="https://nahidattar2.github.io/11/3-3-board.html" target="_blank">🏆 البورد (للسبورة)</a>
  </div>
  <button class="qb" data-u="https://nahidattar2.github.io/11/3-3.html" data-t="اختبار المثلثات المتطابقة">عرض رمز QR للطالبات</button>
  <div class="url" dir="ltr">https://nahidattar2.github.io/11/3-3.html</div>
</section>
</div>
<div id="ov"><h3 id="ovt"></h3><div id="ovq"></div><button id="ovx">إغلاق</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
if(window.QRCode){
  document.querySelectorAll(".qb").forEach(function(b){b.style.display="block";b.onclick=function(){
    var q=document.getElementById("ovq");q.innerHTML="";
    new QRCode(q,{text:b.getAttribute("data-u"),width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
    document.getElementById("ovt").textContent="امسحي الرمز: "+b.getAttribute("data-t");
    document.getElementById("ov").style.display="flex";}});
}
document.getElementById("ovx").onclick=function(){document.getElementById("ov").style.display="none"};
</script></body></html>
