<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>شهادات اختبار فصل التوازي والتعامد</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Geeza Pro","GeezaPro","Noto Naskh Arabic",Tahoma,sans-serif;background:#f6f3fa;color:#1f2233;line-height:1.8}
.top{background:linear-gradient(135deg,#4b33b5,#8e5bd8 60%,#d65ba8);color:#fff;text-align:center;padding:26px 16px 44px}.top h1{font-size:22px}
.wrap{max-width:460px;margin:-26px auto 24px;padding:0 14px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(60,30,90,.12);padding:22px 20px}
label{display:block;font-weight:bold;margin-bottom:8px}
input{width:100%;font:inherit;font-size:22px;letter-spacing:3px;text-align:center;direction:ltr;padding:10px;border:2px solid #e1e3ea;border-radius:12px}
.btn{display:flex;justify-content:center;width:100%;margin-top:14px;border:0;border-radius:14px;padding:12px 12px 16px;font:inherit;font-size:18px;font-weight:bold;color:#fff;cursor:pointer;
 background:linear-gradient(180deg,#f2a0d8 0%,#d65ba8 42%,#b83c8b calc(100% - 5px),#7d1f5c calc(100% - 5px))}
.btn.pu{background:linear-gradient(180deg,#9d86f2 0%,#6a4fd6 42%,#4b33b5 calc(100% - 5px),#2f1f80 calc(100% - 5px))}
.msg{margin-top:12px;border-radius:12px;padding:10px 14px;display:none}.msg.err{display:block;background:#fde8e8;color:#b42323}.msg.wait{display:block;background:#ece9fb;color:#4b33b5}
.tools{max-width:1000px;margin:14px auto;padding:0 14px;display:none;gap:10px}.tools .btn{margin:0}
.sheet{width:1000px;max-width:96vw;margin:0 auto 30px;display:none;position:relative;overflow:hidden;container-type:inline-size;background:#fff center/100% 100% no-repeat;box-shadow:0 4px 18px rgba(60,30,90,.18)}
.sheet.st{aspect-ratio:1199/847;background-image:url(cert-student.jpg)}.sheet.pa{aspect-ratio:1200/958;background-image:url(cert-parent.jpg)}
.ab{position:absolute;text-align:center;text-wrap:balance}
/* student (girl) */
.st .nm{right:33cqw;left:27cqw;top:26.4cqw;font-size:3.1cqw;font-weight:bold;color:#5b2d9c;line-height:1.2}
.st .bd{right:28cqw;left:31cqw;top:34cqw;font-size:1.95cqw;color:#3b2d55;line-height:1.55}
.st .lv{right:39.5cqw;left:39.7cqw;top:42.3cqw;font-size:2.7cqw;font-weight:bold;color:#6a3aa8;line-height:1.3}
.st .bl{right:32.5cqw;left:35.5cqw;top:49.2cqw;font-size:1.75cqw;color:#3b2d55;line-height:1.55}
.st .im{right:31cqw;left:34cqw;top:53.6cqw;font-size:1.45cqw;font-weight:bold;color:#9b3f80}
.st .lg{right:5.5cqw;top:33.5cqw;width:20cqw}
.st .tc{right:28.6cqw;width:15cqw;top:61.6cqw;font-size:1.35cqw;color:#5b4a75;line-height:1.35}.st .tc b{display:block;font-size:1.7cqw;color:#4b2d8c}
.st .sg{left:62.5cqw;right:auto;top:56.6cqw;height:4.8cqw}
.st .sc{left:26.5cqw;width:16cqw;top:62.4cqw;font-size:1.3cqw;color:#5b4a75;line-height:1.35}
/* parent (flowers) */
.pa .lg{left:5cqw;top:4.6cqw;width:17cqw}
.pa .hd{right:9cqw;top:23cqw;font-size:3cqw;font-weight:bold;color:#8a6fc4}
.pa .nm{right:12cqw;left:12cqw;top:28.5cqw;font-size:3.6cqw;font-weight:bold;color:#7a52bf;line-height:1.3}
.pa .bd{right:11cqw;left:11cqw;top:35cqw;font-size:2.3cqw;color:#3d3a4a;line-height:1.75}
.pa .tc{right:10cqw;top:50cqw;font-size:1.8cqw;color:#8a6fc4;text-align:right;line-height:1.4}.pa .tc b{font-size:2.2cqw;color:#7a52bf;margin-right:.6cqw}
.pa .sg{right:38cqw;top:48cqw;height:5.5cqw}
.pa .dt{left:10cqw;top:51cqw;font-size:1.5cqw;color:#9a8fb5}
.st .hd,.st .dt,.pa .lv,.pa .bl,.pa .im,.pa .sc{display:none}
@media print{body{background:#fff}.top,.wrap,.tools,.foot{display:none!important}.sheet{display:block!important;width:297mm;max-width:none;margin:0 auto;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet.pa{width:263mm}}
.foot{text-align:center;color:#8a8ea0;font-size:13px;padding:10px}
</style></head><body>
<div class="top"><h1 id="h">شهادة شكر وتقدير للطالبة – اختبار فصل التوازي والتعامد</h1><div>معلمة الرياضيات: ناهد علي عطار</div></div>
<div class="wrap"><div class="card" id="login">
 <label>اكتبي رقم هوية الطالبة</label>
 <input id="id" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="١٠ أرقام">
 <button class="btn" id="go">عرض الشهادة</button><div class="msg" id="msg"></div>
 <div style="font-size:13px;color:#8a8ea0;text-align:center;margin-top:12px">رقم الهوية لا يُرسل ولا يُحفظ؛ يُستعمل على جهازكِ فقط.</div>
</div></div>
<div class="tools" id="tools"><button class="btn" onclick="print()">طباعة / حفظ PDF</button><button class="btn pu" id="back">رجوع</button></div>
<div class="sheet" id="sheet">
 <img class="ab lg" src="cert-logo-color.png" alt="">
 <div class="ab hd">إلى ولي أمر الطالبة:</div>
 <div class="ab nm" id="nm"></div><div class="ab bd" id="bd"></div><div class="ab lv" id="lv"></div><div class="ab bl" id="bl"></div><div class="ab im" id="im"></div>
 <div class="ab tc">معلمة الرياضيات <b>ناهد علي عطار</b></div><img class="ab sg" src="cert-sign.png" alt="">
 <div class="ab sc">مدرسة الموهوبات التقنية الثانوية<br>مكة المكرمة</div><div class="ab dt">١٤٤٨هـ</div>
</div>
<div class="foot">مدرسة الموهوبات التقنية الثانوية – مكة المكرمة</div>
<script>
const SALT="nahidattar2|parallel-cert-1448|",IT=250000,$=i=>document.getElementById(i),NQ=20,NQA="٢٠",TEST="اختبار فصل التوازي والتعامد",DIR="certs";
const PARENT=new URLSearchParams(location.search).get("t")==="p";
if(PARENT) $("h").textContent="شهادة شكر وتقدير لولي الأمر – "+TEST;
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const toLatin=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"");
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
function show(t,c){$("msg").className="msg "+c;$("msg").textContent=t;}
function fill(d){
 $("sheet").className="sheet "+(PARENT?"pa":"st"); $("nm").textContent=d.name; $("im").textContent="";
 if(PARENT){ $("bd").textContent="تتقدّم معلمة الرياضيات بخالص الشكر والتقدير لولي أمر الطالبة على اهتمامه ومتابعته المستمرة لابنته وحرصه على تقدّمها الدراسي وتعاونه المثمر مع المدرسة؛ فالبيت شريكنا في النجاح."; return; }
 const sc=AR(d.score)+" من "+NQA;
 if(d.lvl==="full"){ $("bd").textContent="لحصولها على الدرجة الكاملة ("+sc+") في "+TEST+"، تقديرًا لتميّزها وموهبتها الرياضية"; $("lv").textContent="موهبة رياضية"; $("bl").textContent="بارك الله في جهودكِ، واستمري في التميّز والإبداع"; }
 else if(d.lvl==="thanks"){ $("bd").textContent="لتفوّقها وحصولها على "+sc+" في "+TEST+"، تقديرًا لجدّها واجتهادها"; $("lv").textContent="متفوّقة"; $("bl").textContent="بارك الله في جهودكِ، واستمري في التفوّق والعطاء"; }
 else { $("bd").textContent="تقديرًا لجهدها ومشاركتها في "+TEST+"، وثقةً بقدرتها على التقدّم والتميّز"; $("lv").textContent="مجتهدة"; $("bl").textContent="كل خطوة في خطتكِ العلاجية تقرّبكِ من التميّز، فاستمري"; }
 if(d.prev!=null) $("im").textContent="🌟 تحسّن مستواكِ عن الاختبار السابق: من "+AR(Math.round(d.prev*100/d.prevnq))+"٪ إلى "+AR(Math.round(d.score*100/NQ))+"٪";
}
async function go(){
 const id=toLatin($("id").value); if(id.length!==10){show("رقم الهوية يجب أن يكون ١٠ أرقام.","err");return;}
 show("جارٍ البحث…","wait");
 try{ const e=new TextEncoder(); const base=await crypto.subtle.importKey("raw",e.encode(id),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:e.encode(SALT),iterations:IT},base,512);
  const r=await fetch(DIR+"/"+hex(bits.slice(32,44))+".bin",{cache:"no-store"}); if(!r.ok) throw "nf";
  const buf=await r.arrayBuffer(); const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-GCM",false,["decrypt"]);
  const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12))));
  fill(d); $("msg").className="msg"; document.querySelector(".wrap").style.display="none"; $("tools").style.display="flex"; $("sheet").style.display="block";
 }catch(x){ show(x==="nf"?"لا توجد شهادة لهذا الرقم. تأكدي من رقم الهوية.":"تعذّر فتح الشهادة، حاولي مرة أخرى.","err"); }
}
$("go").onclick=go; $("id").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
$("back").onclick=()=>{document.querySelector(".wrap").style.display="block";$("tools").style.display="none";$("sheet").style.display="none";$("id").value="";};
</script></body></html>
