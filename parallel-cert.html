<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>شهادات اختبار فصل التوازي والتعامد</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Geeza Pro","GeezaPro","Noto Naskh Arabic",Tahoma,sans-serif;background:#f3f4f7;color:#1f2233;line-height:1.8}
.top{background:linear-gradient(180deg,#4b33b5,#7a68d6);color:#fff;text-align:center;padding:28px 16px 44px}.top h1{font-size:23px}
.wrap{max-width:460px;margin:-26px auto 24px;padding:0 14px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(30,30,60,.12);padding:22px 20px}
label{display:block;font-weight:bold;margin-bottom:8px}
input{width:100%;font:inherit;font-size:22px;letter-spacing:3px;text-align:center;direction:ltr;padding:10px;border:2px solid #e1e3ea;border-radius:12px}
.btn{display:flex;justify-content:center;width:100%;margin-top:14px;border:0;border-radius:14px;padding:12px 12px 16px;font:inherit;font-size:18px;font-weight:bold;color:#fff;cursor:pointer;
 background:linear-gradient(180deg,#a596f0 0%,#6a55d4 40%,#4b33b5 calc(100% - 5px),#2f1f80 calc(100% - 5px))}
.btn.gold{background:linear-gradient(180deg,#ffd77a 0%,#e0a106 45%,#b97f00 calc(100% - 5px),#7a5400 calc(100% - 5px))}
.msg{margin-top:12px;border-radius:12px;padding:10px 14px;display:none}.msg.err{display:block;background:#fde8e8;color:#b42323}.msg.wait{display:block;background:#ece9fb;color:#4b33b5}
.tools{max-width:1000px;margin:14px auto;padding:0 14px;display:none;gap:10px}.tools .btn{margin:0}
.sheet{width:1000px;max-width:96vw;aspect-ratio:2724/1874;margin:0 auto 30px;display:none;position:relative;overflow:hidden;container-type:inline-size;background:#fff center/100% 100% no-repeat;box-shadow:0 4px 18px rgba(60,30,90,.18)}
.sheet.st{background-image:url(cert-student.jpg)}.sheet.pa{background-image:url(cert-parent.jpg)}
.sheet .in{position:absolute;text-align:center;display:flex;flex-direction:column;align-items:center}
.st .in{left:24cqw;right:9cqw;top:5cqw}.pa .in{left:16cqw;right:20cqw;top:9.5cqw}
.logo{height:4.6cqw;margin-bottom:1.2cqw}
.ttl{font-size:6.2cqw;font-weight:bold;line-height:1.25;background-image:linear-gradient(90deg,#c26aa5,#9a7ad6);-webkit-background-clip:text;background-clip:text;color:transparent}
.pa .ttl{font-size:5.6cqw;background-image:linear-gradient(90deg,#a48be0,#7a5cc4)}
.pa .in{top:7.6cqw}.pa .logo{height:4cqw;margin-bottom:.6cqw}.pa .t2{font-size:2cqw;max-width:56cqw;line-height:1.65}.pa .nm{font-size:4.2cqw}.pa .sch,.pa .dt{display:none}.tch i{display:none}.pa .tch i{display:block;font-style:normal;font-size:1.4cqw;color:#a7a0c4}
.rib{color:#b0679c;font-size:2.1cqw;font-weight:bold;margin:.2cqw 0 .6cqw}.pa .rib{color:#d494be}
.orn{width:44cqw;height:1.2cqw;margin:.2cqw 0 .8cqw;background:radial-gradient(circle,#c79ac0 35%,transparent 40%) center/1.2cqw 1.2cqw no-repeat,linear-gradient(#cfa6c6,#cfa6c6) center/100% .14cqw no-repeat}
.t1{font-size:2.4cqw;color:#a85f94}.pa .t1{color:#c98fb9}
.nm{font-size:4.6cqw;font-weight:bold;color:#b4589a;margin:.4cqw 0 .6cqw;padding:0 2cqw .4cqw;border-bottom:.18cqw dotted #b4589a;line-height:1.35}
.pa .nm{color:#8a6fd0;border-color:#c7b8ee}
.t2{font-size:2.2cqw;color:#b0679c;line-height:1.75;max-width:62cqw}.pa .t2{color:#5ea98a}
.imp{margin-top:.8cqw;background:#f4e3ef;color:#9b3f80;border-radius:2cqw;padding:.2cqw 2cqw;font-size:1.8cqw;font-weight:bold}
.tch{position:absolute;text-align:center;color:#8fa5cf}.tch span{display:block;font-size:2cqw;font-weight:bold;color:#9fb1d8}.tch b{font-size:3cqw;color:#8aa0cc}
.st .tch{right:7.2cqw;bottom:13.5cqw}.pa .tch{left:0;right:0;bottom:8.3cqw}
.sgn{position:absolute;height:6.5cqw}.pa .sgn{left:61cqw;bottom:9.4cqw}.st .sgn{display:none}
.dt{position:absolute;bottom:3.6cqw;left:0;right:0;text-align:center;font-size:1.7cqw;font-weight:bold;color:#b48aa8}.pa .dt{bottom:7.5cqw;font-size:1.4cqw;color:#a7a0c4}
.sch{font-size:1.5cqw;color:#a98ab0;margin-top:.4cqw}
@media print{body{background:#fff}.top,.wrap,.tools,.foot{display:none!important}.sheet{display:block!important;width:297mm;max-width:none;height:204mm;margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.foot{text-align:center;color:#8a8ea0;font-size:13px;padding:10px}
</style></head><body>
<div class="top"><h1 id="h">شهادتي – اختبار فصل التوازي والتعامد</h1><div>معلمة الرياضيات: ناهد علي عطار</div></div>
<div class="wrap"><div class="card" id="login">
 <label id="lb">اكتبي رقم هوية الطالبة</label>
 <input id="id" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="١٠ أرقام">
 <button class="btn gold" id="go">عرض الشهادة</button><div class="msg" id="msg"></div>
 <div style="font-size:13px;color:#8a8ea0;text-align:center;margin-top:12px">رقم الهوية لا يُرسل ولا يُحفظ؛ يُستعمل على جهازكِ فقط.</div>
</div></div>
<div class="tools" id="tools"><button class="btn gold" onclick="print()">طباعة / حفظ PDF</button><button class="btn" id="back">رجوع</button></div>
<div class="sheet" id="sheet"><div class="in"><img class="logo" src="cert-logo.png" alt=""><div class="ttl" id="ttl"></div><div class="rib" id="rib"></div><div class="orn"></div>
<div class="t1" id="t1"></div><div class="nm" id="nm"></div><div class="t2" id="t2"></div><div class="imp" id="imp" style="display:none"></div><div class="sch">مدرسة الموهوبات التقنية الثانوية – مكة المكرمة</div></div>
<div class="tch"><span>معلمة الرياضيات</span><b>ناهد علي عطار</b><i>جمادى الآخرة ١٤٤٨هـ</i></div><img class="sgn" src="cert-sign.png" alt=""><div class="dt">جمادى الآخرة ١٤٤٨هـ</div></div>
<div class="foot">مدرسة الموهوبات التقنية الثانوية – مكة المكرمة</div>
<script>
const SALT="nahidattar2|parallel-cert-1448|",IT=250000,$=i=>document.getElementById(i);
const PARENT=new URLSearchParams(location.search).get("t")==="p";
if(PARENT){$("h").textContent="شهادة شكر لولي الأمر – اختبار فصل التوازي والتعامد";}
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const toLatin=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"");
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
function show(t,c){$("msg").className="msg "+c;$("msg").textContent=t;}
const TEST="اختبار الفصل الثاني: التوازي والتعامد";
function fill(d){
 $("sheet").className="sheet "+(PARENT?"pa":"st");
 if(PARENT){ $("ttl").textContent="شكر وتقدير"; $("rib").textContent="للاهتمام والمتابعة";
   $("t1").textContent="تتقدم معلمة الرياضيات بخالص الشكر والتقدير إلى ولي أمر الطالبة"; $("nm").textContent=d.name;
   $("t2").textContent="على اهتمامه ومتابعته المستمرة لابنته، وحرصه على تقدمها الدراسي، وتعاونه المثمر مع المدرسة؛ فالبيت شريك النجاح."; }
 else if(d.lvl==="full"){ $("ttl").textContent="شهادة شكر وتميّز"; $("rib").textContent="موهبة رياضية";
   $("t1").textContent="تتقدم معلمة الرياضيات بالشكر والتقدير للطالبة الموهوبة"; $("nm").textContent=d.name;
   $("t2").textContent="لحصولها على الدرجة الكاملة ("+AR(d.score)+" من ٢٠) في "+TEST+"، تقديرًا لتميّزها وموهبتها الرياضية، متمنيةً لها دوام التفوق والإبداع."; }
 else if(d.lvl==="thanks"){ $("ttl").textContent="شهادة شكر وتقدير"; $("rib").textContent="تفوق دراسي";
   $("t1").textContent="تتقدم معلمة الرياضيات بالشكر والتقدير للطالبة"; $("nm").textContent=d.name;
   $("t2").textContent="لتفوقها وحصولها على "+AR(d.score)+" من ٢٠ في "+TEST+"، متمنيةً لها مزيدًا من النجاح والتألق."; }
 else { $("ttl").textContent="شهادة تشجيع"; $("rib").textContent="أنتِ قادرة";
   $("t1").textContent="تتقدم معلمة الرياضيات بالتحية والتقدير للطالبة"; $("nm").textContent=d.name;
   $("t2").textContent="تقديرًا لجهدها ومشاركتها في "+TEST+"، وثقةً بقدرتها على التقدم؛ فكل خطوة في خطتها العلاجية تقرّبها من التميز."; }
 if(!PARENT && d.imp){ $("imp").style.display="inline-block"; $("imp").textContent="🌟 تحسّن مستواها عن الاختبار السابق: من "+AR(d.prev)+" إلى "+AR(d.score)+" من ٢٠"; } else $("imp").style.display="none";
}
async function go(){
 const id=toLatin($("id").value); if(id.length!==10){show("رقم الهوية يجب أن يكون ١٠ أرقام.","err");return;}
 show("جارٍ البحث…","wait");
 try{ const e=new TextEncoder(); const base=await crypto.subtle.importKey("raw",e.encode(id),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:e.encode(SALT),iterations:IT},base,512);
  const r=await fetch("certs/"+hex(bits.slice(32,44))+".bin",{cache:"no-store"}); if(!r.ok) throw "nf";
  const buf=await r.arrayBuffer(); const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-GCM",false,["decrypt"]);
  const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12))));
  fill(d); $("msg").className="msg"; document.querySelector(".wrap").style.display="none"; $("tools").style.display="flex"; $("sheet").style.display="block";
 }catch(x){ show(x==="nf"?"لا توجد شهادة لهذا الرقم. تأكدي من رقم الهوية.":"تعذّر فتح الشهادة، حاولي مرة أخرى.","err"); }
}
$("go").onclick=go; $("id").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
$("back").onclick=()=>{document.querySelector(".wrap").style.display="block";$("tools").style.display="none";$("sheet").style.display="none";$("id").value="";};
</script></body></html>
